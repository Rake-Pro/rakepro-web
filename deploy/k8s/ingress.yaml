# Optional ingress. Adjust ingressClassName, host, and TLS to match your
# cluster (nginx/traefik, cert-manager, etc.). Remove if you front the service
# with something else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rakepro-web
  labels:
    app.kubernetes.io/name: rakepro-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rake.pro
      secretName: rakepro-web-tls
  rules:
    - host: rake.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rakepro-web
                port:
                  name: http
