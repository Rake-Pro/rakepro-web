<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="steel" x1="40" y1="40" x2="210" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6dba0"/>
      <stop offset="0.45" stop-color="#8a9145"/>
      <stop offset="1" stop-color="#4a4f1c"/>
    </linearGradient>
    <linearGradient id="steelHi" x1="40" y1="40" x2="210" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0f3c8"/>
      <stop offset="1" stop-color="#b6bd6a"/>
    </linearGradient>
    <radialGradient id="via" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e8ecbe"/>
      <stop offset="0.5" stop-color="#9aa150"/>
      <stop offset="1" stop-color="#4a4f1c"/>
    </radialGradient>
  </defs>

  <!-- circuit branch traces (left side) -->
  <g stroke="#20220f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M84 80 H62 V64"/>
    <path d="M84 116 H50"/>
    <path d="M84 152 H66 V186"/>
    <path d="M84 188 H50"/>
  </g>
  <g stroke="url(#steel)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M84 80 H62 V64"/>
    <path d="M84 116 H50"/>
    <path d="M84 152 H66 V186"/>
    <path d="M84 188 H50"/>
  </g>

  <!-- R letterform: dark edge then steel face -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#20220f" stroke-width="36">
      <path d="M84 56 V200"/>
      <path d="M84 56 H150 L176 82 V104 L150 130 H84"/>
      <path d="M130 130 L180 200"/>
    </g>
    <g stroke="url(#steel)" stroke-width="24">
      <path d="M84 56 V200"/>
      <path d="M84 56 H150 L176 82 V104 L150 130 H84"/>
      <path d="M130 130 L180 200"/>
    </g>
    <!-- top highlight -->
    <g stroke="url(#steelHi)" stroke-width="5" opacity="0.85">
      <path d="M84 60 V196"/>
      <path d="M88 60 H148 L172 84"/>
    </g>
  </g>

  <!-- via pads -->
  <g>
    <circle cx="62" cy="60" r="11" fill="url(#via)" stroke="#20220f" stroke-width="3"/>
    <circle cx="62" cy="60" r="3.5" fill="#15160a"/>
    <circle cx="46" cy="116" r="11" fill="url(#via)" stroke="#20220f" stroke-width="3"/>
    <circle cx="46" cy="116" r="3.5" fill="#15160a"/>
    <circle cx="66" cy="190" r="10" fill="url(#via)" stroke="#20220f" stroke-width="3"/>
    <circle cx="66" cy="190" r="3" fill="#15160a"/>
    <circle cx="46" cy="188" r="11" fill="url(#via)" stroke="#20220f" stroke-width="3"/>
    <circle cx="46" cy="188" r="3.5" fill="#15160a"/>
  </g>
</svg>
