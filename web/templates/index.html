<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAKEPRO</title>
  <meta name="description" content="RakePro - links and contact.">
  <meta name="theme-color" content="#020712">

  <meta property="og:title" content="RakePro">
  <meta property="og:description" content="Links and contact.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/static/img/avatar-circuit-r.png">

  <link rel="icon" type="image/svg+xml" href="https://cdn.rake.pro/assets/rakepro/vector/rakepro-circuit-r-primary.svg">
  <link rel="preload" as="image" href="/static/img/rakepro-home-bg-selected-2_5-4k.webp" type="image/webp">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="frame" aria-hidden="true">
    <span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span>
  </div>

  <div class="deck">
    <header class="rail">
      <span class="rail-host">
        <img class="rail-mark" src="https://cdn.rake.pro/assets/rakepro/vector/rakepro-circuit-r-primary.svg" alt="" aria-hidden="true">
        rake.pro <span class="rail-sep">/</span> home
      </span>
      <span class="rail-spacer"></span>
      <span class="rail-clock">
        <span class="rail-sep">UTC</span>
        <b id="clock" aria-live="off">--:--:--</b>
      </span>
    </header>

    <main class="stage" aria-labelledby="site-title">
      <div class="hero">
        <p class="eyebrow">Public Access Terminal</p>
        <img
          id="site-title"
          class="brand-wordmark"
          src="https://cdn.rake.pro/assets/rakepro/vector/rakepro-wordmark-primary.svg"
          alt="RAKEPRO">
      </div>

      <nav class="command-bar" aria-label="RAKEPRO destinations">
        <!-- StreamOnline adds .is-live, swapping the Twitch meta STREAM -> LIVE. -->
        <a class="cmd{{if .StreamOnline}} is-live{{end}}" href="{{.StreamURL}}" target="_blank" rel="noopener">
          <span class="cmd-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 3h16v11l-4 4h-4l-3 3H7v-3H4z"/>
              <path d="M11 8v4M16 8v4"/>
            </svg>
          </span>
          <span class="cmd-body">
            <span class="cmd-title">Twitch</span>
            <span class="cmd-meta cmd-meta-default">Stream</span>
            <span class="cmd-meta cmd-meta-live">
              <span class="live-dot" aria-hidden="true"></span>Live
            </span>
          </span>
          <span class="cmd-ch" aria-hidden="true">01</span>
        </a>

        <a class="cmd" href="https://github.com/Rake-Pro" target="_blank" rel="noopener">
          <span class="cmd-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.85 9.73.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.79.62-3.38-1.23-3.38-1.23-.46-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.94.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.34 9.34 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/>
            </svg>
          </span>
          <span class="cmd-body">
            <span class="cmd-title">GitHub</span>
            <span class="cmd-meta">Code</span>
          </span>
          <span class="cmd-ch" aria-hidden="true">02</span>
        </a>

        <a class="cmd" href="https://discord.gg/rakepro" target="_blank" rel="noopener">
          <span class="cmd-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.3 5.4A17 17 0 0 0 15.1 4l-.2.4a12.6 12.6 0 0 1 3.7 1.9 15.5 15.5 0 0 0-13.2 0A12.6 12.6 0 0 1 9.1 4.4L8.9 4a17 17 0 0 0-4.2 1.4C2 9.3 1.3 13.1 1.6 16.9a17 17 0 0 0 5.2 2.6l.6-1a11 11 0 0 1-1.8-.9l.4-.3a12 12 0 0 0 10.3 0l.4.3c-.6.4-1.2.7-1.8.9l.6 1a17 17 0 0 0 5.2-2.6c.4-4.4-.7-8.2-2.9-11.5ZM8.6 14.8c-1 0-1.9-.9-1.9-2.1 0-1.1.8-2.1 1.9-2.1s1.9 1 1.9 2.1c0 1.2-.8 2.1-1.9 2.1Zm6.8 0c-1 0-1.9-.9-1.9-2.1 0-1.1.8-2.1 1.9-2.1s1.9 1 1.9 2.1c0 1.2-.8 2.1-1.9 2.1Z"/>
            </svg>
          </span>
          <span class="cmd-body">
            <span class="cmd-title">Discord</span>
            <span class="cmd-meta">Comms</span>
          </span>
          <span class="cmd-ch" aria-hidden="true">03</span>
        </a>

        <a class="cmd" href="mailto:admin@rake.pro">
          <span class="cmd-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3.5 7 8.5 6 8.5-6"/>
            </svg>
          </span>
          <span class="cmd-body">
            <span class="cmd-title">Email</span>
            <span class="cmd-meta">Contact</span>
          </span>
          <span class="cmd-ch" aria-hidden="true">04</span>
        </a>
      </nav>
    </main>

    <footer class="site-status">
      <span class="system-status">
        <span class="status-dot" aria-hidden="true"></span>
        System Online
      </span>
      <span>&copy; {{.Year}} RAKEPRO</span>
    </footer>
  </div>

  <script src="/static/js/main.js" defer></script>
</body>
</html>
